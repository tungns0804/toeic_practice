<!-- Bỏ qua menu: người dùng bàn phím (và trình đọc màn hình) không phải Tab qua
     thương hiệu + năm mục menu + các nút ở MỌI trang mới tới được nội dung. Nằm
     ngoài màn hình cho tới khi nhận focus.

     Là <button> chứ không phải <a href="#main-content">: khi mở bằng file:// thì
     router định tuyến bằng dấu #, nên nó sẽ hiểu href đó là một đường dẫn và ném
     người dùng ra khỏi trang. -->
<button type="button" class="skip-link" (click)="focusMain()">
  <app-t key="app.skipToContent" />
</button>

<!-- Thanh bên: menu chính trên màn hình từ 768px trở lên. Điện thoại dùng thanh
     menu đáy (.bottom-nav) thay cho nó. -->
<aside class="app-sidebar">
  <a routerLink="/" class="brand" [title]="t('app.title')">
    <span class="brand-mark" aria-hidden="true">990</span>
    <span class="brand-text">
      <span class="brand-name">TOEIC 990</span>
      <span class="brand-sub"><app-t key="app.namePrefix" /></span>
    </span>
  </a>

  <nav class="side-nav" [attr.aria-label]="t('app.nav')">
    <ng-container [ngTemplateOutlet]="navLinks" />
  </nav>
</aside>

<div class="app-frame">
  <header class="app-header" #appHeader>
    <div class="topbar">
      <!-- Chỉ hiện trên điện thoại, nơi không có thanh bên để giữ thương hiệu. -->
      <a routerLink="/" class="brand topbar-brand">
        <span class="brand-mark" aria-hidden="true">990</span>
        <span class="brand-name">TOEIC 990</span>
      </a>

      <nav class="crumbs" [attr.aria-label]="t('app.breadcrumb')">
        <a routerLink="/" class="crumb-home">TOEIC 990</a>
        @if (crumbKey(); as key) {
          <span class="crumb-sep" aria-hidden="true">/</span>
          <span class="crumb-current"><app-t [key]="key" /></span>
        }
      </nav>

      <div class="app-actions">
        <!-- Chuỗi ngày học: luôn trong tầm mắt, bấm vào là về kế hoạch hôm nay.
             Sáng màu lửa khi hôm nay đã đạt mục tiêu, nhạt khi còn phải học. -->
        <a
          routerLink="/"
          class="icon-btn streak-chip"
          [attr.data-state]="activity.streak().state"
          [title]="streakChipLabel()"
          [attr.aria-label]="streakChipLabel()"
        >
          <app-icon name="flame" />
          <span>{{ activity.streak().current }}</span>
        </a>

        <button
          type="button"
          class="icon-btn"
          (click)="lang.toggle()"
          [title]="t('app.language.switch', { name: lang.nextName() })"
          [attr.aria-label]="t('app.language.switch', { name: lang.nextName() })"
        >
          <app-icon name="globe" />
          <span class="lang-label">{{ lang.short() }}</span>
        </button>

        <button
          type="button"
          class="icon-btn"
          (click)="theme.cycle()"
          [title]="
            t('theme.title', { current: t(theme.labelKey()), next: t(theme.nextLabelKey()) })
          "
          [attr.aria-label]="
            t('theme.title', { current: t(theme.labelKey()), next: t(theme.nextLabelKey()) })
          "
        >
          <app-icon [name]="theme.icon()" />
          <span class="theme-label"><app-t [key]="theme.labelKey()" /></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Thanh tiến trình chuyển trang. Luôn nằm trong DOM và chỉ đổi độ mờ: bật/tắt
       bằng @if thì nó bụp một cái. role="status" để trình đọc màn hình biết trang
       đang tải; lời báo là NỘI DUNG bên trong vì role="status" chỉ đọc khi nội
       dung đổi, không đọc khi một thuộc tính đổi. -->
  <div class="route-progress" [class.is-active]="navigating()" role="status">
    @if (navigating()) {
      <span class="sr-only">{{ t('app.navigating') }}</span>
    }
    <span class="route-progress-bar" aria-hidden="true"></span>
  </div>

  <main id="main-content" tabindex="-1" [class.has-bottom-nav]="group() !== null">
    <router-outlet />
  </main>
</div>

<!-- Menu đáy của điện thoại: năm mục, luôn trong tầm ngón cái. Ẩn ở màn hình luyện
     tập và kết quả (group() === null) để người học tập trung và bàn phím ảo không
     đẩy nó lên che câu hỏi. -->
@if (group() !== null) {
  <nav class="bottom-nav" [attr.aria-label]="t('app.nav')">
    <ng-container [ngTemplateOutlet]="navLinks" />
  </nav>
}

<!-- Nút quay lên đầu trang. Luôn nằm trong DOM, chỉ mờ đi và không nhận chuột khi
     chưa cuộn đủ xa — bật/tắt bằng @if thì nó bụp một cái, không có gì để chuyển. -->
<button
  type="button"
  class="to-top"
  [class.is-visible]="scrolledDown()"
  [attr.aria-hidden]="scrolledDown() ? null : 'true'"
  [attr.tabindex]="scrolledDown() ? null : -1"
  (click)="scrollToTop()"
  [title]="t('app.backToTop')"
  [attr.aria-label]="t('app.backToTop')"
>
  <span aria-hidden="true">↑</span>
</button>

<!-- Một bộ mục menu cho cả thanh bên lẫn thanh đáy: hai nơi chỉ khác nhau ở CSS.
     Nơi nào không hợp khổ màn hình thì display: none, nên trình đọc màn hình luôn
     chỉ gặp đúng một menu. -->
<ng-template #navLinks>
  @for (item of navGroups; track item.id) {
    <a
      class="nav-link"
      [routerLink]="item.path"
      [class.is-active]="group()?.id === item.id"
      [attr.aria-current]="group()?.id === item.id ? 'true' : null"
    >
      <app-icon [name]="item.icon" />
      <span class="nav-label"><app-t [key]="item.labelKey" /></span>
    </a>
  }
</ng-template>
