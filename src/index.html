<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Luyện thi TOEIC 990</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Luyện thi TOEIC 990: khóa ngữ pháp 59 bài cho Part 5 & 6, 12 thì tiếng Anh, từ vựng theo band điểm và bài tập chuyên đề — có chuỗi ngày học và thống kê tiến độ.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230057b8'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <script>
    // Áp dụng tông màu đã lưu NGAY trước khi Angular khởi động, nếu không trang sẽ
    // chớp màu hệ thống một nhịp rồi mới đổi. Giữ đoạn này đồng bộ với ThemeStore.
    try {
      var saved = JSON.parse(localStorage.getItem('toeic-practice:theme') || '""');
      if (saved === 'light' || saved === 'dark' || saved === 'night') {
        document.documentElement.setAttribute('data-theme', saved);
      }
      var lang = JSON.parse(localStorage.getItem('toeic-practice:language') || '""');
      if (lang === 'vi' || lang === 'en') document.documentElement.lang = lang;
    } catch (e) { /* localStorage bị chặn thì cứ theo mặc định */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
